[pytest]
testpaths = tests
addopts = -v -p no:cacheprovider
bdd_features_base_dir = features/
markers =
    p0: critical path, runs on every change
    p1: important regression
    wap: Twitch mobile web (WAP) tests
    unit: offline framework tests, no browser or network
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
